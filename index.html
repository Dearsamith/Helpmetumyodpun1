/* Modern rounded typography + softer UI */

/* v20: ลำดับระยะรายละเอียดจำหน่ายตามแบบกระดาษ
   ชั้น 1 หมวดใหญ่ = เต็มความกว้าง / จำนวนชิดขวา
   ชั้น 2 รายการย่อย = ขยับเข้ากลาง
   ชั้น 3 ยอดแยกชั้นปี/ยอดย่อย = ขยับเข้ากลางอีกขั้น */
.detail-cat-line{
  grid-template-columns:42px minmax(0,1fr) 72px 40px!important;
  width:100%;
  margin-left:0;
}
.detail-item-line{
  grid-template-columns:42px minmax(0,1fr) 72px 40px!important;
  width:82%;
  margin-left:30px;
  padding-left:0;
}
.detail-year-count{
  grid-template-columns:42px minmax(0,1fr) 72px 40px!important;
  width:68%;
  margin-left:78px;
  padding-left:0;
}
.detail-name-line{
  padding-left:76px;
}

  .detail-cat-line{
    grid-template-columns:34px minmax(0,1fr) 56px 34px!important;

  .detail-item-line{
    grid-template-columns:34px minmax(0,1fr) 56px 34px!important;
    width:90%;
    margin-left:16px;
  }
  .detail-year-count{
    grid-template-columns:34px minmax(0,1fr) 56px 34px!important;
    width:78%;
    margin-left:38px;
    padding-left:0;
  }
  .detail-name-line{padding-left:42px}
}

@media print{

    grid-template-columns:12mm minmax(0,1fr) 18mm 12mm!important;
    width:100%;
    margin-left:0;
  }
  .detail-item-line{
    grid-template-columns:12mm minmax(0,1fr) 18mm 12mm!important;
    width:82%;
    margin-left:8mm;
    padding-left:0;
  }
  .detail-year-count{
    grid-template-columns:12mm minmax(0,1fr) 18mm 12mm!important;

function processAll(){
 const r=record();
 if(!receiveRoundsTouched){
  const found=roundsFoundInTexts(r.raw);
  if(found.length)receiveRounds=found;

 const selected=sortRounds([...receiveRounds]),multiple=selected.length>1,roundResults={};

function commit(){

 const all=selected.flatMap(rr=>(pending.rounds[rr]||[]).filter(Boolean));
 if(!all.length||all.some(c=>c.errors.length))return;

 const sourceRaw=[...(pending.sourceRaw||record().raw)],records=[],learned=[];

 for(const c of all)for(const rawName of (c.unknownItems||[])){
  const x=canonical(rawName);
  if(!x.known&&!removedNameSet().has(dictKey(x.name))){
   state.dict.push({name:x.name,cat:x.cat,group:x.group,aliases:''});
   learned.push(x.name);
  }
 }
 migrateDictionary();
 for(const c of all)for(const y of Object.values(c.years||{}))if(y&&Array.isArray(y.items))y.items=mergeStoredItems(y.items);

 for(const rr of selected){
  const companies=pending.rounds[rr]||[];
  if(!companies.some(Boolean))continue;
  const k=keyFor(rr),existed=Object.prototype.hasOwnProperty.call(state.days,k);
  records.push({key:k,existed,record:existed?structuredClone(state.days[k]):null});
  state.days[k]={raw:[...sourceRaw],companies,updated:new Date().toISOString()};
 }

 if(!records.length)return;

 save();

 const current=$('#round').value,nextRound=selected.includes(current)?current:selected[0];
 $('#round').value=nextRound;activeRound=nextRound;

 go(1);
 toast('บันทึก '+records.length+' รอบแล้ว'+(learned.length?' · เพิ่มชื่อทางการใหม่ '+[...new Set(learned)].length+' รายการ':''));
}

function detailSheet(round,copyNo=1){const n=countFor(round),rows=aggregateFor(round);return `<article class="sheet detail-sheet"><div class="round-sheet-label">${formatRoundTime(round)} · รายละเอียด · ใบที่ ${copyNo}/${roundCopies[round]||1}</div><div class="detail-sheet-head"><h2>รายละเอียดการจำหน่าย</h2><p>${sheetHeader(round)}</p>${roundMismatchIssues(round).length?'<p class="draft-label">⚠ ยอดไม่ตรง — กรุณาตรวจสอบก่อนใช้งาน</p>':''}${n<3?'<p class="draft-label">ฉบับร่าง — รับยอดไม่ครบ 3 ร้อย</p>':''}</div><div class="detail-sheet-body">${detailPrintBody(rows)}</div></article>`}
function buildSelectedSheets(){ensurePrintRounds();return printRounds.flatMap(r=>Array.from({length:roundCopies[r]||1},(_,i)=>sheet(r,i+1)+detailSheet(r,i+1))).join('')}
function makeSheets(){const e=$('#sheets');if(e)e.innerHTML=buildSelectedSheets();updateRoundPicker()}
function online(){return `<div class="heading"><div><h1>ยอดออนไลน์</h1><span class="muted">คัดลอกข้อความเพื่อนำไปวางในฟอร์มหรือแชต</span></div><button type="button" class="primary" onclick="copyText()" ${count()?'':'disabled'}>คัดลอกทั้งหมด</button></div>${mismatchBanner($('#round').value)}<div class="card"><label class="check"><input type="checkbox" id="thai" onchange="updateOutput()">ใช้เลขไทย</label>${count()<3?'<div class="warning">ฉบับร่าง — รับยอดยังไม่ครบ 3 ร้อย</div>':''}<textarea class="output" id="output" readonly>${esc(output())}</textarea></div>`}
function output(){let rows=aggregate();return `${count()<3?'[ฉบับร่าง รับยอด '+count()+'/3 ร้อย]\n':''}${state.unit}\nวันที่ ${$('#date').value}\nรอบ ${formatRoundTime($('#round').value)} ${rounds[$('#round').value]}\nยอดเดิม ${sum(rows,'base')} นาย\n\n`+rows.reverse().map(r=>`ชั้นปีที่ ${r.year}\nยอดเดิม ${r.base} นาย\nจำหน่าย\n${r.items.map(i=>'-'+i.name+' '+i.n+' นาย'+((i.names||[]).length?'\n'+i.names.map(n=>'  -'+n).join('\n'):'')).join('\n')||'-'}\nรวมจำหน่าย ${r.dis} นาย\nคงเหลือ ${r.left} นาย`).join('\n________________\n')+`\n\nรวมจำหน่าย ${sum(rows,'dis')} นาย\nคงเหลือรวม ${sum(rows,'left')} นาย`}
function updateOutput(){$('#output').value=$('#thai').checked?output().replace(/\d/g,c=>'๐๑๒๓๔๕๖๗๘๙'[c]):output()}
async function copyText(){try{await navigator.clipboard.writeText($('#output').value);toast('คัดลอกแล้ว')}catch(e){$('#output').select();toast('เลือกข้อความให้แล้ว กด Ctrl+C เพื่อคัดลอก')}}
function dictionaryRows(group){const seen=new Set();return state.dict.map((d,i)=>{const name=formalizeItemName(d.name,d.group),key=dictKey(name);return {...d,i,name,key}}).filter(d=>{const g=d.group||inferDictGroup(d.name,d.cat);if(g!==group||seen.has(d.key))return false;seen.add(d.key);return true}).sort((a,b)=>a.name.localeCompare(b.name,'th'))}
function dictionary(){return `<div class="heading"><div><h1>บัญชีชื่อยอด</h1><span class="muted">แสดงเฉพาะชื่อทางการเพียงรายการเดียวต่อยอด ชื่อซ้ำ ชื่อย่อ และชื่อที่สะกดใกล้เคียงกันจะถูกรวมอัตโนมัติ</span></div></div><div class="warning">บัญชีนี้จะแสดง <b>ชื่อทางการเท่านั้น</b> เช่น “ทีมบอล / ฟุตบอล” จะเหลือเพียง <b>ชมรมฟุตบอล</b> และ “ตามแนวพระราชดำริ” จะเหลือเพียง <b>โครงการตามแนวพระราชดำริ</b><br>ชื่อที่หมายถึงยอดเดียวกันจะถูกรวมเหลือชื่อทางการที่สุดเพียงชื่อเดียว เช่น “โครงตามแนวพระราชดำริ” → “โครงการตามแนวพระราชดำริ” และ “โดรน” → “โดรนและโรโบติก” โดยจะใช้ชื่อเดียวกันทั้งบัญชีชื่อยอดและรายละเอียดจำหน่าย</div><div class="dict-toolbar"><label>ค้นหาชื่อทางการ<input id="dictSearch" placeholder="เช่น ชมรมฟุตบอล, โครงการตามแนวพระราชดำริ" oninput="filterDictionary(this.value)"></label><button type="button" data-dict-action="expand">กางทั้งหมด</button><button type="button" data-dict-action="collapse">พับทั้งหมด</button></div><div id="dictSections">${dictGroups.map((group,gi)=>{const rows=dictionaryRows(group);if(!rows.length)return '';return `<details class="dict-section" data-group="${esc(group)}" ${gi<2?'open':''}><summary><span class="dict-summary-main"><span>${esc(group)}</span><span class="dict-count">${rows.length} รายการ</span></span></summary><div class="dict-body"><div class="dict-head"><span>ชื่อทางการ</span><span>หมวดบัญชี</span><span>ลงช่อง</span><span></span></div>${rows.map(d=>`<div class="dict-entry" data-search="${esc([d.name,d.group,d.cat].join(' '))}"><input class="dict-name" aria-label="ชื่อทางการ" value="${esc(d.name)}" onchange="editDict(${d.i},'name',this.value)"><select aria-label="หมวดบัญชี" onchange="editDict(${d.i},'group',this.value)">${dictGroups.map(g=>`<option ${g===d.group?'selected':''}>${g}</option>`).join('')}</select><select aria-label="ลงช่อง" onchange="editDict(${d.i},'cat',this.value)">${cats.map(c=>`<option ${c===d.cat?'selected':''}>${c}</option>`).join('')}</select><button type="button" class="danger" data-dict-action="remove" data-dict-key="${esc(d.key)}">ลบ</button></div>`).join('')}</div></details>`}).join('')}</div><section class="card dict-add"><h2>เพิ่มชื่อยอดทางการ</h2><div class="dict-add-grid"><label>ชื่อทางการ<input id="newname" placeholder="เช่น ชมรมว่ายน้ำ"></label><label>หมวดบัญชี<select id="newgroup">${dictGroups.map(g=>`<option ${g==='อื่นๆ'?'selected':''}>${g}</option>`).join('')}</select></label><label>ลงช่อง<select id="newcat">${cats.map(c=>`<option ${c==='อื่นๆ'?'selected':''}>${c}</option>`).join('')}</select></label><button type="button" onclick="addDict()">เพิ่มรายการ</button></div><div class="dict-note">ระบบจะไม่สร้างชื่อไม่ทางการเป็นรายการแยก และจะรวมชื่อที่สะกดต่างกันเล็กน้อยเข้าชื่อทางการเดิมอัตโนมัติ</div></section>`}
function filterDictionary(value){const q=dictKey(value);document.querySelectorAll('.dict-section').forEach(sec=>{let visible=0;sec.querySelectorAll('.dict-entry').forEach(row=>{const hit=!q||dictKey(row.dataset.search).includes(q);row.style.display=hit?'':'none';if(hit)visible++});sec.style.display=visible?'':'none';if(q&&visible)sec.open=true})}
function expandDict(open){document.querySelectorAll('.dict-section').forEach(d=>d.open=open)}
function editDict(i,k,v){const d=state.dict[i];if(!d)return;if(k==='name'){const n=formalizeItemName(v,d.group);if(!n)return render();if(state.dict.some((o,j)=>j!==i&&dictKey(o.name)===dictKey(n))){toast('มีชื่อทางการนี้แล้ว');render();return}d.name=n;d.aliases='';d.group=inferDictGroup(n,d.cat);state.removedDictNames=(state.removedDictNames||[]).filter(x=>dictKey(x)!==dictKey(n));migrateDictionary();migrateStoredItemNames();save();render();return}if(k==='group'){d.group=dictGroups.includes(v)?v:'อื่นๆ';if(d.group==='ชมรม')d.name=formalizeItemName(d.name,'ชมรม');d.aliases='';migrateDictionary();migrateStoredItemNames();save();render();return}if(k==='cat'){d.cat=v;d.group=inferDictGroup(d.name,d.cat)==='อื่นๆ'?d.group:inferDictGroup(d.name,d.cat);d.aliases='';migrateDictionary();save();render()}}
function addDict(){const group=$('#newgroup').value,cat=$('#newcat').value,raw=$('#newname').value.trim(),n=formalizeItemName(raw,group);if(!n)return toast('กรอกชื่อรายการก่อน');if(state.dict.some(d=>dictKey(d.name)===dictKey(n)))return toast('มีชื่อทางการนี้แล้ว');state.removedDictNames=(state.removedDictNames||[]).filter(x=>dictKey(x)!==dictKey(n));state.dict.push({name:n,cat,group:group==='ชมรม'?'ชมรม':inferDictGroup(n,cat)==='อื่นๆ'?group:inferDictGroup(n,cat),aliases:''});migrateDictionary();save();render();toast('เพิ่มชื่อทางการ “'+n+'” แล้ว')}
function removeDictByKey(key){
 key=dictKey(key);if(!key)return;
 const matches=state.dict.filter(d=>dictKey(formalizeItemName(d.name,d.group))===key);
 if(!matches.length){toast('ไม่พบรายการที่จะลบ');return}
 const formal=formalizeItemName(matches[0].name,matches[0].group);
 state.removedDictNames=state.removedDictNames||[];
 if(!state.removedDictNames.some(x=>dictKey(formalizeItemName(x))===key))state.removedDictNames.push(formal);

 // ลบทุก entry ที่หมายถึงยอดเดียวกัน ไม่ใช่แค่แถวเดียว
 state.dict=state.dict.filter(d=>dictKey(formalizeItemName(d.name,d.group))!==key);
 save();
 render();
 toast('ลบ “'+formal+'” ออกจากบัญชีชื่อยอดแล้ว');
}
function removeDict(i){
 const d=state.dict[i];if(!d)return;
 removeDictByKey(dictKey(formalizeItemName(d.name,d.group)));
}

function handleDictionaryButtonClick(e){
 const btn=e.target.closest('button[data-dict-action]');
 if(!btn)return;
 const action=btn.dataset.dictAction;
 if(action==='expand'){expandDict(true);return}
 if(action==='collapse'){expandDict(false);return}
 if(action==='add'){addDict();return}
 if(action==='remove'){removeDictByKey(btn.dataset.dictKey||'');return}
}
document.addEventListener('click',handleDictionaryButtonClick);

function settings(){return `<h1>ตั้งค่า / วิธีใช้</h1><p class="muted">ตั้งค่าข้อมูลที่ใช้ในใบยอดและสำรองข้อมูลบนเครื่องนี้</p><div class="split"><section class="card"><h2>ข้อมูลบนใบยอด</h2><label>ชื่อผู้เขียนยอด<input value="${esc(state.writer)}" onchange="state.writer=this.value;save()"></label><label>ตำแหน่งผู้เขียน (ทกท.)<input value="${esc(state.writerPosition||defaultWriterPosition(state.unit))}" onchange="state.writerPosition=this.value;save()"></label><small>เช่น กองพันที่ 1: ทกท.หน.พัน.๑ กรม นนร.รอ. สามารถแก้ข้อความเองได้ตามกองพัน</small><label>ชื่อตัวแทนชั้นกองพัน<input value="${esc(state.signer)}" onchange="state.signer=this.value;save()"></label></section><section class="card"><h2>สำรองข้อมูล</h2><p>ข้อมูลเก็บในเบราว์เซอร์นี้ ไม่ซิงก์ข้ามเครื่อง การล้างข้อมูลเว็บไซต์อาจทำให้ยอดหาย ควรดาวน์โหลดสำรองไว้</p><div class="actions"><button type="button" onclick="backup()">ดาวน์โหลดข้อมูลสำรอง</button><label>กู้คืนจากไฟล์<input type="file" accept=".json" onchange="importBackup(this)"></label></div></section></div><section class="card"><h2>วิธีใช้งาน</h2><ol><li>เลือกวันที่และหน่วยด้านบน</li><li>หน้า “รับยอดจากกองร้อย” วางฟอร์มของ ร้อย.1–3 ได้ทั้งชุด แม้มีหลายรอบในข้อความเดียว</li><li>เลือกรอบได้หลายรอบ หรือให้ระบบตรวจหัว 0630 / 0700 / 0800 / 1600 / 2100 อัตโนมัติ แล้วกดตรวจสอบและยืนยันบันทึก</li><li>หน้า “ใบยอดที่ต้องเขียน” เลือกหลายรอบพร้อมกันได้ โดยตัวเลือกรอบยอดด้านบนจะซ่อนเฉพาะหน้านี้</li><li>ตำแหน่งผู้เขียนบนใบยอดแก้ได้จากหน้านี้ให้ตรงกับกองพันที่ใช้งาน</li></ol><p>กฎการเรียงยังคงเดิม: ตารางชั้นปี 1→5, ข้อความออนไลน์ 5→1, รายการจำหน่ายเรียงตามชื่อภาษาไทยและรวมชื่อเดียวกัน โดยบัญชีชื่อยอดจะแสดงเฉพาะชื่อทางการ ชื่อเก่าจะไม่ถูกเก็บเป็นรายการ และชื่อที่กดลบจะถูกเอาออกจากบัญชีจริงและไม่ถูกเพิ่มกลับอัตโนมัติจนกว่าจะเพิ่มเองใหม่</p></section>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,data:state},null,2)],{type:'application/json'}));a.download='roster-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importBackup(el){try{const x=JSON.parse(await el.files[0].text());if(x.version!==1||!x.data||typeof x.data.unit!=='string'||!Array.isArray(x.data.dict)||!x.data.days)throw 0;for(const d of x.data.dict)if(typeof d.name!=='string'||typeof d.aliases!=='string'||!cats.includes(d.cat))throw 0;for(const r of Object.values(x.data.days)){if(r.manual){if(!Array.isArray(r.manual)||r.manual.length!==5)throw 0;for(let idx=0;idx<5;idx++){let row=r.manual[idx];if(row.year!==idx+1||!Number.isSafeInteger(row.base)||row.base<0||!Array.isArray(row.items)||row.items.some(i=>typeof i.name!=='string'||!Number.isSafeInteger(i.n)||i.n<0||(i.names&&(!Array.isArray(i.names)||!i.names.every(n=>typeof n==='string')))||(i.manualCat&&!cats.includes(i.manualCat))))throw 0;if(recalc([row])[0].left<0)throw 0}}if(!Array.isArray(r.raw)||r.raw.length!==3||!r.raw.every(x=>typeof x==='string')||!Array.isArray(r.companies)||r.companies.length!==3)throw 0;for(const c of r.companies.filter(Boolean))for(let y=1;y<=5;y++){const a=c.years?.[y];if(!a||!Number.isInteger(a.base)||a.base<0||!Array.isArray(a.items)||!a.items.every(i=>typeof i.name==='string'&&Number.isInteger(i.n)&&i.n>=0&&(!i.names||(Array.isArray(i.names)&&i.names.every(n=>typeof n==='string')))))throw 0}}if(!confirm('แทนที่ข้อมูลทั้งหมดบนเครื่องนี้ด้วยไฟล์สำรอง?'))return;state=x.data;if(!state.theme)state.theme='light';if(!state.writerPosition)state.writerPosition=defaultWriterPosition(state.unit);if(!Array.isArray(state.removedDictNames))state.removedDictNames=[];migrateDictionary();migrateStoredItemNames();migrateDictionary();$('#unit').value=state.unit;save();render();toast('กู้คืนข้อมูลแล้ว')}catch(e){toast('ไฟล์สำรองไม่ถูกต้อง')}}
let activeDate=$('#date').value,activeRound=$('#round').value;
function leaveEditor(){return true}
$('#date').onchange=()=>{if(!leaveEditor()){$('#date').value=activeDate;return}if(!$('#date').value)$('#date').value=today();activeDate=$('#date').value;pending=null;receiveRounds=[];receiveRoundsTouched=false;render()};
$('#round').onchange=()=>{if(!leaveEditor()){$('#round').value=activeRound;return}activeRound=$('#round').value;pending=null;receiveRounds=[];receiveRoundsTouched=false;if(tab===2)printRounds=[];render()};
$('#unit').onchange=()=>{if(!leaveEditor()){$('#unit').value=state.unit;return}const oldDefault=defaultWriterPosition(state.unit);state.unit=$('#unit').value;if(!state.writerPosition||state.writerPosition===oldDefault)state.writerPosition=defaultWriterPosition(state.unit);save();render()};
render();

</script></body></html>
